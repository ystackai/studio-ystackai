<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Debt Frog Sink</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; overflow: hidden; background: #f7f4e8; color: #111; font-family: Georgia, serif; display: grid; place-items: center; transition: background 0.44s linear, color 0.44s linear; }
    .grid { position: fixed; inset: 0; background-image: linear-gradient(rgba(0,0,0,.08) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,.08) 1px, transparent 1px); background-size: 42px 42px; pointer-events: none; }
    .scene { position: relative; width: min(88vw, 620px); text-align: center; z-index: 1; }
    .copy { font-size: 24px; line-height: 1.25; margin-bottom: 28px; transition: font-size .2s ease; }
    .frog-container { font-size: 88px; margin: 28px auto; transition: transform .44s ease; }
    .terms-button { display: inline-block; padding: 14px 20px; border: 2px solid currentColor; cursor: pointer; user-select: none; transition: transform .12s ease; }
    .void { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .44s linear; }
    .fade-to-black { opacity: 1; }
    .sink-animation { transform: translateY(22vh) scale(.72); }
  </style>
</head>
<body>
  <div class="grid"></div>
  <main class="scene">
    <div class="copy" id="textContainer">Your request is being recalculated against the current debt tier.</div>
    <div class="frog-container" id="frogContainer">FROG</div>
    <div class="terms-button" id="termsButton">ACCEPT TERMS</div>
  </main>
  <div class="void" id="void"></div>
  <script>
    (function () {
      var tiers = ['low', 'medium', 'high', 'extreme'];
      var scales = { low: 1, medium: 0.85, high: 0.68, extreme: 0.52 };
      function getDebtTier() {
        var tier = tiers[Math.floor(Math.random() * tiers.length)];
        document.cookie = 'debtTier=' + tier + '; path=/';
        return tier;
      }
      function applyDebtTier() {
        var tier = getDebtTier();
        var scale = scales[tier] || 1;
        document.getElementById('textContainer').style.fontSize = Math.max(14, 24 * scale) + 'px';
        document.getElementById('termsButton').style.transform = 'scale(' + scale + ')';
        document.getElementById('frogContainer').style.transform = 'scale(' + (0.72 + scale * 0.28) + ')';
      }
      function startSink() {
        document.getElementById('frogContainer').classList.add('sink-animation');
        setTimeout(function () {
          document.body.style.background = '#000';
          document.body.style.color = '#fff';
          document.getElementById('void').classList.add('fade-to-black');
        }, 440);
      }
      window.addEventListener('load', function () {
        applyDebtTier();
        var button = document.getElementById('termsButton');
        button.addEventListener('mouseenter', function () { button.style.transform += ' scale(1.04)'; });
        button.addEventListener('mouseleave', applyDebtTier);
        button.addEventListener('click', startSink);
        setTimeout(startSink, 1200);
      });
    })();
  </script>
</body>
</html>
