<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ystackai — Oscillator Phase Patch</title>
  <style>
    :root {
      --bg: #0a0e1a;
      --surface: #111827;
      --border: rgba(148,163,184,0.12);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #6366f1;
      --accent-glow: rgba(99,102,241,0.35);
      --cyan: #67e8f9;
      --green: #22c55e;
      --pink: #fb7185;
      --yellow: #fde047;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%; width: 100%;
      background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      overflow: hidden;
    }
    #app {
      display: flex; flex-direction: column;
      height: 100%; width: 100%;
      max-width: 800px; margin: 0 auto;
      padding: 1.5rem 1rem;
      position: relative;
    }

    /* Header */
    .header {
      display: flex; align-items: center; justify-content: space-between;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 1rem;
    }
    .header h1 {
      font-size: 1.15rem; font-weight: 800; letter-spacing: -0.5px;
      background: linear-gradient(90deg, var(--cyan), var(--accent));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .header .tag {
      font-size: 0.65rem; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--muted);
      background: rgba(99,102,241,0.1); padding: 0.2rem 0.6rem; border-radius: 10px;
      border: 1px solid rgba(99,102,241,0.2);
    }

    /* Phase grid */
    .phase-container {
      flex: 1; display: flex; flex-direction: column;
      min-height: 0;
    }
    .phase-label {
      display: flex; justify-content: space-between; align-items: baseline;
      margin-bottom: 0.5rem;
    }
    .phase-label span {
      font-size: 0.7rem; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.06em;
    }
    .phase-label .phase-value {
      font-size: 0.85rem; color: var(--cyan); font-weight: 800;
      font-variant-numeric: tabular-nums;
    }
    #phase-canvas {
      width: 100%; flex: 1; border-radius: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      cursor: pointer;
      min-height: 180px;
    }

    /* Status strip */
    .status-strip {
      display: flex; gap: 0.5rem; margin-top: 0.75rem;
      flex-wrap: wrap;
    }
    .status-pip {
      width: 28px; height: 28px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.6rem; font-weight: 800;
      border: 2px solid var(--border);
      transition: all 0.3s ease;
      position: relative;
    }
    .status-pip.active {
      border-color: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
    }
    .status-pip.synced {
      border-color: var(--green);
      box-shadow: 0 0 12px rgba(34,197,94,0.3);
      background: rgba(34,197,94,0.15);
    }
    .status-pip.drift {
      border-color: var(--pink);
      box-shadow: 0 0 12px rgba(251,113,133,0.3);
      background: rgba(251,113,133,0.12);
      animation: drift-pulse 0.6s ease-in-out infinite alternate;
    }
    @keyframes drift-pulse {
      from { transform: scale(1); }
      to { transform: scale(1.15); }
    }

    /* Control bar */
    .control-bar {
      display: flex; align-items: center; justify-content: center;
      gap: 1rem; padding-top: 1rem;
      margin-top: auto;
      border-top: 1px solid var(--border);
    }
    #patch-btn {
      position: relative;
      padding: 0.85rem 2.8rem;
      font-size: 0.95rem; font-weight: 800;
      letter-spacing: 0.04em; text-transform: uppercase;
      color: #fff; background: linear-gradient(135deg, var(--accent), #8b5cf6);
      border: none; border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 24px rgba(99,102,241,0.3);
      outline: none;
    }
    #patch-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 32px rgba(99,102,241,0.5);
    }
    #patch-btn:active {
      transform: scale(0.96);
    }
    #patch-btn:disabled {
      opacity: 0.4; cursor: not-allowed; transform: none;
      box-shadow: none;
    }
    #patch-btn::after {
      content: '';
      position: absolute; inset: -2px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--cyan), var(--accent), var(--pink));
      z-index: -1;
      opacity: 0;
      transition: opacity 0.3s;
    }
    #patch-btn.glow::after { opacity: 1; animation: ring-glow 1s ease infinite; }
    @keyframes ring-glow {
      0%, 100% { filter: blur(6px); }
      50% { filter: blur(14px); }
    }

    #mute-btn {
      background: rgba(148,163,184,0.1);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.5rem 0.75rem;
      font-size: 0.8rem; font-weight: 700;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.15s;
      outline: none;
    }
    #mute-btn:hover { border-color: var(--accent); color: var(--text); }
    #mute-btn.muted { color: var(--pink); border-color: rgba(251,113,133,0.4); }

    /* Cycle counter */
    .cycle-info {
      text-align: center; margin-top: 0.5rem;
      font-size: 0.72rem; color: var(--muted);
      letter-spacing: 0.04em;
    }
    .cycle-info strong { color: var(--cyan); }

    /* Scan overlay */
    .scan-overlay {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none; z-index: 10;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 3px,
        rgba(99,102,241,0.015) 3px, rgba(99,102,241,0.015) 4px
      );
      border-radius: 16px;
      opacity: 0;
      transition: opacity 0.4s;
    }
    .scan-overlay.visible { opacity: 1; }

    /* Success state */
    .success-flash {
      position: absolute; inset: 0; z-index: 20;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at center, rgba(34,197,94,0.12), transparent 70%);
      opacity: 0; pointer-events: none;
      transition: opacity 0.5s;
      border-radius: 16px;
    }
    .success-flash.visible { opacity: 1; }
    .success-flash .success-msg {
      font-size: 1.6rem; font-weight: 900;
      color: var(--green);
      text-shadow: 0 0 30px rgba(34,197,94,0.5);
      letter-spacing: -0.5px;
    }

    /* Mobile */
    @media (max-width: 600px) {
      #app { padding: 1rem 0.75rem; }
      #phase-canvas { min-height: 150px; }
      #patch-btn { padding: 0.75rem 2rem; font-size: 0.85rem; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="scan-overlay" id="scan"></div>
    <div class="success-flash" id="success">
      <div class="success-msg">PHASE SYNCED</div>
    </div>

    <div class="header">
      <h1>PHASE PATCHER</h1>
      <span class="tag">24-col oscillator</span>
    </div>

    <div class="phase-container">
      <div class="phase-label">
        <span>Phase Window</span>
        <span class="phase-value" id="phase-val">0.000 Hz</span>
      </div>
      <canvas id="phase-canvas"></canvas>
    </div>

    <div class="status-strip" id="status-strip"></div>

    <div class="control-bar">
      <button id="mute-btn" aria-label="Toggle audio">🔊 AUDIO</button>
      <button id="patch-btn">PATCH</button>
    </div>

    <div class="cycle-info">
      Cycles completed: <strong id="cycle-count">0</strong> / 6
    </div>
  </div>

  <script>
  (function() {
    'use strict';

    var NUM_OSCILLATORS = 6;
    var CYCLES_TO_SYNC = 6;
    var colors = ['#67e8f9','#22c55e','#fb7185','#fde047','#6366f1','#a855f7'];

    var ctx, canvas, width, height;
    var oscillators = [];
    var cycling = false;
    var cycleCount = 0;
    var muted = false;
    var audioCtx = null;
    var animFrame = null;

    // Init oscillators
    function initOscillators() {
      oscillators = [];
      for (var i = 0; i < NUM_OSCILLATORS; i++) {
        oscillators.push({
          phase: Math.random() * Math.PI * 2,
          freq: 0.015 + Math.random() * 0.025,
          amp: 0.3 + Math.random() * 0.7,
          synced: false,
          color: colors[i],
          index: i
        });
      }
    }

    // Web Audio
    function ensureAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playTone(freq, duration, type, vol) {
      if (muted || !audioCtx) return;
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = type || 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(vol || 0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function playKick() {
      playTone(80, 0.15, 'sine', 0.12);
    }

    function playDrift(osc) {
      var f = 200 + osc.index * 80;
      playTone(f, 0.3, 'triangle', 0.05);
    }

    function playSync() {
      playTone(523, 0.12, 'sine', 0.08);
      setTimeout(function(){ playTone(659, 0.12, 'sine', 0.08); }, 80);
      setTimeout(function(){ playTone(784, 0.15, 'sine', 0.08); }, 160);
    }

    function playSuccess() {
      var notes = [523, 659, 784, 1047];
      notes.forEach(function(n, i) {
        setTimeout(function() { playTone(n, 0.4, 'sine', 0.06); }, i * 120);
      });
      setTimeout(function() { playTone(523, 1.0, 'sine', 0.09); }, 500);
    }

    function playFail() {
      playTone(150, 0.5, 'sawtooth', 0.04);
    }

    // Canvas setup
    function resizeCanvas() {
      canvas = document.getElementById('phase-canvas');
      var rect = canvas.getBoundingClientRect();
      var dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx = canvas.getContext('2d');
      ctx.scale(dpr, dpr);
      width = rect.width;
      height = rect.height;
    }

    // Draw grid + waveforms
    function draw(time) {
      ctx.clearRect(0, 0, width, height);

      // Background grid columns (24-col reference)
      var colWidth = width / 24;
      ctx.strokeStyle = 'rgba(148,163,184,0.04)';
      ctx.lineWidth = 1;
      for (var i = 1; i < 24; i++) {
        ctx.beginPath();
        ctx.moveTo(i * colWidth, 0);
        ctx.lineTo(i * colWidth, height);
        ctx.stroke();
      }

      // Center line
      var cy = height / 2;
      ctx.strokeStyle = 'rgba(148,163,184,0.08)';
      ctx.beginPath();
      ctx.moveTo(0, cy);
      ctx.lineTo(width, cy);
      ctx.stroke();

      // Draw each oscillator waveform
      var segH = height / (NUM_OSCILLATORS + 1);
      oscillators.forEach(function(osc, i) {
        var yBase = segH * (i + 1);
        ctx.beginPath();
        ctx.strokeStyle = osc.synced ? '#22c55e' : osc.color;
        ctx.lineWidth = osc.synced ? 2.5 : 1.8;
        ctx.globalAlpha = 0.3 + osc.amp * 0.7;

        for (var x = 0; x < width; x += 2) {
          var xPhase = x * 0.008;
          var y = yBase + Math.sin(xPhase + osc.phase) * 25 * osc.amp;
          if (x === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
        ctx.globalAlpha = 1;

        // Phase dot indicator
        var dotX = ((osc.phase % (Math.PI * 2)) / (Math.PI * 2)) * width;
        ctx.beginPath();
        ctx.arc(dotX, yBase, osc.synced ? 5 : 3.5, 0, Math.PI * 2);
        ctx.fillStyle = osc.synced ? '#22c55e' : osc.color;
        ctx.fill();

        if (osc.synced) {
          ctx.beginPath();
          ctx.arc(dotX, yBase, 9, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(34,197,94,0.15)';
          ctx.fill();
        }
      });

      // Phase window indicator
      var totalPhase = 0;
      oscillators.forEach(function(o) { totalPhase += o.phase; });
      var avgFreq = (totalPhase / oscillators.length) / (Math.PI * 2);
      document.getElementById('phase-val').textContent = (avgFreq * 10).toFixed(3) + ' Hz';
    }

    // Animation loop
    function loop(time) {
      oscillators.forEach(function(osc) {
        osc.phase += osc.freq;
      });
      draw(time);
      animFrame = requestAnimationFrame(loop);
    }

    // Status strip
    function buildStatusStrip() {
      var strip = document.getElementById('status-strip');
      strip.innerHTML = '';
      oscillators.forEach(function(osc, i) {
        var pip = document.createElement('div');
        pip.className = 'status-pip' + (osc.synced ? ' synced' : '');
        pip.style.borderColor = osc.synced ? '' : osc.color;
        pip.textContent = (i + 1);
        pip.id = 'pip-' + i;
        strip.appendChild(pip);
      });
    }

    function updatePip(idx) {
      var pip = document.getElementById('pip-' + idx);
      var osc = oscillators[idx];
      pip.className = 'status-pip ' + (osc.synced ? 'synced' : 'drift');
    }

    // Patch action
    function patchPhase() {
      if (cycling) return;
      ensureAudio();
      cycling = true;

      var btn = document.getElementById('patch-btn');
      btn.disabled = true;
      btn.classList.add('glow');
      document.getElementById('scan').classList.add('visible');

      playKick();

      var toSync = Math.min(1 + Math.floor(cycleCount / 2), NUM_OSCILLATORS - countSynced());
      if (toSync <= 0) {
        allSynced();
        return;
      }

      var targets = [];
      for (var i = 0; i < toSync && targets.length < toSync; i++) {
        var idx = Math.floor(Math.random() * NUM_OSCILLATORS);
        if (!oscillators[idx].synced) targets.push(idx);
      }

      var delay = 0;
      targets.forEach(function(idx) {
        delay += 200 + Math.random() * 300;
        setTimeout(function() {
          oscillators[idx].synced = true;
          oscillators[idx].freq = 0.02;
          updatePip(idx);
          playDrift(oscillators[idx]);
        }, delay);
      });

      setTimeout(function() {
        cycling = false;
        btn.disabled = false;
        btn.classList.remove('glow');
        document.getElementById('scan').classList.remove('visible');
        cycleCount++;
        document.getElementById('cycle-count').textContent = cycleCount;

        if (countSynced() >= NUM_OSCILLATORS) {
          allSynced();
        }
      }, delay + 400);
    }

    function countSynced() {
      var c = 0;
      oscillators.forEach(function(o) { if (o.synced) c++; });
      return c;
    }

    function allSynced() {
      cycling = false;
      document.getElementById('patch-btn').disabled = true;
      document.getElementById('scan').classList.add('visible');
      document.getElementById('success').classList.add('visible');
      playSuccess();

      setTimeout(function() {
        document.getElementById('success').classList.remove('visible');
        document.getElementById('scan').classList.remove('visible');
        cycleCount++;
        document.getElementById('cycle-count').textContent = cycleCount;
        if (cycleCount >= CYCLES_TO_SYNC) {
          resetAll();
        } else {
          initOscillators();
          buildStatusStrip();
          document.getElementById('patch-btn').disabled = false;
        }
      }, 2200);
    }

    function resetAll() {
      cycleCount = 0;
      document.getElementById('cycle-count').textContent = '0';
      initOscillators();
      buildStatusStrip();
      document.getElementById('patch-btn').disabled = false;
    }

    // Mute toggle
    document.getElementById('mute-btn').addEventListener('click', function() {
      muted = !muted;
      this.textContent = muted ? '🔇 MUTED' : '🔊 AUDIO';
      this.className = muted ? 'muted' : '';
    });

    // Patch button
    document.getElementById('patch-btn').addEventListener('click', patchPhase);
    document.getElementById('phase-canvas').addEventListener('click', patchPhase);

    // Init
    function init() {
      resizeCanvas();
      initOscillators();
      buildStatusStrip();
      animFrame = requestAnimationFrame(loop);
    }

    window.addEventListener('resize', function() {
      resizeCanvas();
    });

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  })();
  </script>
</body>
</html>
