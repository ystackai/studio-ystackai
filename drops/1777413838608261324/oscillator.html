<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>ystackai — Phase Patcher</title>
    <style>
      :root {
        --bg: #060810;
        --surface: #0d1117;
        --border: rgba(148,163,184,0.08);
        --text: #e2e8f0;
        --muted: #64748b;
        --accent: #6366f1;
        --cyan: #22d3ee;
        --green: #10b981;
        --pink: #f43f5e;
      }
     * { margin: 0; padding: 0; box-sizing: border-box; }
     html, body {
       height: 100%; width: 100%;
       background: var(--bg); color: var(--text);
       font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
       overflow: hidden;
       -webkit-font-smoothing: antialiased;
     }
     #app {
       display: flex; flex-direction: column;
       height: 100%; width: 100%;
       max-width: 720px; margin: 0 auto;
       padding: 2rem 1.5rem;
       position: relative;
     }

     /* Header — minimal, no decoration */
     .header {
       display: flex; align-items: baseline; gap: 0.75rem;
       margin-bottom: 1.5rem;
     }
     .header h1 {
       font-size: 1.05rem; font-weight: 700;
       color: var(--text); letter-spacing: -0.3px;
     }
     .header .tag {
       font-size: 0.6rem; font-weight: 600;
       letter-spacing: 0.1em; text-transform: uppercase;
       color: var(--muted);
     }

     /* Phase display — single column, clean */
     .phase-container {
       flex: 1; display: flex; flex-direction: column;
       min-height: 0;
     }
     .phase-header {
       display: flex; justify-content: space-between; align-items: baseline;
       margin-bottom: 0.65rem;
     }
     .phase-header .label {
       font-size: 0.65rem; font-weight: 600; color: var(--muted);
       text-transform: uppercase; letter-spacing: 0.06em;
     }
     .phase-header .value {
       font-size: 0.8rem; color: var(--cyan); font-weight: 700;
       font-variant-numeric: tabular-nums;
     }
     #phase-canvas {
       width: 100%; flex: 1; border-radius: 10px;
       background: var(--surface);
       border: 1px solid var(--border);
       cursor: pointer;
       min-height: 200px;
     }

     /* Status strip — disciplined spacing */
     .status-strip {
       display: flex; gap: 0.6rem; margin-top: 0.85rem;
       justify-content: center;
     }
     .status-pip {
       width: 32px; height: 32px; border-radius: 50%;
       display: flex; align-items: center; justify-content: center;
       font-size: 0.65rem; font-weight: 700;
       background: var(--surface);
       border: 1.5px solid var(--border);
       color: var(--muted);
       transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
     }
     .status-pip.synced {
       border-color: var(--green);
       color: var(--green);
       background: rgba(16,185,129,0.08);
       box-shadow: 0 0 16px rgba(16,185,129,0.2);
     }
     .status-pip.drift {
       border-color: var(--pink);
       color: var(--pink);
       background: rgba(244,63,94,0.06);
       box-shadow: 0 0 16px rgba(244,63,94,0.15);
       animation: drift-pulse 0.8s ease-in-out infinite alternate;
     }
     @keyframes drift-pulse {
       from { transform: scale(1); }
       to { transform: scale(1.12); }
     }

     /* Control bar — one primary action, no noise */
     .control-bar {
       display: flex; align-items: center; justify-content: center;
       gap: 0.75rem; padding-top: 1.25rem;
       margin-top: 1rem;
     }
     #patch-btn {
       position: relative;
       padding: 0.8rem 2.5rem;
       font-size: 0.85rem; font-weight: 700;
       letter-spacing: 0.05em; text-transform: uppercase;
       color: #fff;
       background: var(--accent);
       border: none; border-radius: 8px;
       cursor: pointer;
       transition: all 0.15s ease;
       box-shadow: 0 2px 20px rgba(99,102,241,0.25);
       outline: none;
     }
     #patch-btn:hover:not(:disabled) {
       background: #7c7ff7;
       box-shadow: 0 4px 28px rgba(99,102,241,0.4);
     }
     #patch-btn:active:not(:disabled) {
       transform: scale(0.97);
     }
     #patch-btn:disabled {
       opacity: 0.3; cursor: default;
       box-shadow: none;
     }
     #patch-btn.glow {
       animation: btn-glow 0.8s ease-in-out infinite alternate;
     }
     @keyframes btn-glow {
       from { box-shadow: 0 0 12px rgba(99,102,241,0.3); }
       to { box-shadow: 0 0 28px rgba(99,102,241,0.55); }
     }

     #mute-btn {
       background: transparent;
       border: 1px solid var(--border);
       border-radius: 6px;
       padding: 0.45rem 0.65rem;
       font-size: 0.7rem; font-weight: 600;
       color: var(--muted);
       cursor: pointer;
       transition: all 0.15s;
       outline: none;
       font-family: inherit;
     }
     #mute-btn:hover { border-color: rgba(148,163,184,0.2); color: var(--muted); }
     #mute-btn.muted { color: var(--pink); border-color: rgba(244,63,94,0.25); }

     /* Progress ring — subtle, informative */
     .progress-row {
       display: flex; align-items: center; justify-content: center;
       gap: 0.5rem; margin-top: 0.6rem;
     }
     .progress-text {
       font-size: 0.62rem; color: var(--muted);
       letter-spacing: 0.04em; font-variant-numeric: tabular-nums;
     }
     .progress-text strong { color: var(--cyan); font-weight: 700; }

      /* Processing flash */
      .scan-overlay {
          position: absolute; top: 0; left: 0; right: 0; bottom: 0;
          pointer-events: none; z-index: 10;
          background: rgba(99,102,241,0.03);
          border-radius: 12px;
          opacity: 0;
          transition: opacity 0.25s;
        }
        .scan-overlay.visible { opacity: 1; }

     /* Success state — clean, no clutter */
     .success-flash {
       position: absolute; inset: 0; z-index: 20;
       display: flex; align-items: center; justify-content: center;
       opacity: 0; pointer-events: none;
       transition: opacity 0.4s;
     }
     .success-flash.visible { opacity: 1; }
     .success-flash .success-msg {
       font-size: 1.1rem; font-weight: 700;
       color: var(--green);
       letter-spacing: -0.3px;
       text-transform: uppercase;
     }

     /* Mobile — one screen, no scroll */
     @media (max-width: 600px) {
       #app { padding: 1.25rem 1rem; }
       #phase-canvas { min-height: 160px; }
       #patch-btn { padding: 0.7rem 2rem; font-size: 0.8rem; }
     }
   </style>
</head>
<body>
    <div id="app">
    <div class="scan-overlay" id="scan"></div>
    <div class="success-flash" id="success">
      <div class="success-msg">Synched</div>
    </div>

    <div class="header">
      <h1>Phase Patcher</h1>
      <span class="tag">oscillator sync</span>
    </div>

    <div class="phase-container">
      <div class="phase-header">
        <span class="label">Phase Window</span>
        <span class="value" id="phase-val">0.000 Hz</span>
      </div>
      <canvas id="phase-canvas"></canvas>
    </div>

    <div class="status-strip" id="status-strip"></div>

    <div class="control-bar">
      <button id="mute-btn" aria-label="Toggle audio">AUDIO</button>
      <button id="patch-btn">PATCH</button>
    </div>

    <div class="progress-row">
      <span class="progress-text"><strong id="cycle-count">0</strong> / 6 cycles</span>
    </div>
    </div>

  <script>
  (function() {
    'use strict';

    var NUM_OSCILLATORS = 6;
    var CYCLES_TO_SYNC = 6;
    var colors = ['#67e8f9','#22c55e','#fb7185','#fde047','#6366f1','#a855f7'];

    var ctx, canvas, width, height;
    var oscillators = [];
    var cycling = false;
    var cycleCount = 0;
    var muted = false;
    var audioCtx = null;
    var animFrame = null;

    // Init oscillators
    function initOscillators() {
      oscillators = [];
      for (var i = 0; i < NUM_OSCILLATORS; i++) {
        oscillators.push({
          phase: Math.random() * Math.PI * 2,
          freq: 0.015 + Math.random() * 0.025,
          amp: 0.3 + Math.random() * 0.7,
          synced: false,
          color: colors[i],
          index: i
        });
      }
    }

    // Web Audio
    function ensureAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playTone(freq, duration, type, vol) {
      if (muted || !audioCtx) return;
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = type || 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(vol || 0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

     function playKick() {
       playTone(80, 0.12, 'sine', 0.1);
      }

     function playDrift(osc) {
       var f = 220 + osc.index * 60;
       playTone(f, 0.2, 'triangle', 0.04);
      }

     function playSuccess() {
       var notes = [523, 659, 784, 1047];
       notes.forEach(function(n, i) {
        setTimeout(function() { playTone(n, 0.35, 'sine', 0.05); }, i * 100);
        });
       setTimeout(function() { playTone(523, 0.8, 'sine', 0.07); }, 450);
      }

    // Canvas setup
    function resizeCanvas() {
      canvas = document.getElementById('phase-canvas');
      var rect = canvas.getBoundingClientRect();
      var dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx = canvas.getContext('2d');
      ctx.scale(dpr, dpr);
      width = rect.width;
      height = rect.height;
    }

      // Draw waveforms — no grid noise
    function draw(time) {
      ctx.clearRect(0, 0, width, height);

       // Draw each oscillator waveform
      var segH = height / (NUM_OSCILLATORS + 1);
      oscillators.forEach(function(osc, i) {
        var yBase = segH * (i + 1);
        ctx.beginPath();
        ctx.strokeStyle = osc.synced ? '#10b981' : osc.color;
        ctx.lineWidth = osc.synced ? 2.2 : 1.5;
        ctx.globalAlpha = osc.synced ? 0.8 : (0.25 + osc.amp * 0.45);

        for (var x = 0; x < width; x += 2) {
          var xPhase = x * 0.01;
          var y = yBase + Math.sin(xPhase + osc.phase) * 22 * osc.amp;
          if (x === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
        ctx.globalAlpha = 1;

         // Phase dot — minimal
        var dotX = ((osc.phase % (Math.PI * 2)) / (Math.PI * 2)) * width;
        ctx.beginPath();
        ctx.arc(dotX, yBase, osc.synced ? 4 : 2.5, 0, Math.PI * 2);
        ctx.fillStyle = osc.synced ? '#10b981' : osc.color;
        ctx.fill();
      });

       // Phase window readout
      var totalPhase = 0;
      oscillators.forEach(function(o) { totalPhase += o.phase; });
      var avgFreq = (totalPhase / oscillators.length) / (Math.PI * 2);
      document.getElementById('phase-val').textContent = (avgFreq * 10).toFixed(3) + ' Hz';
    }

    // Animation loop
    function loop(time) {
      oscillators.forEach(function(osc) {
        osc.phase += osc.freq;
      });
      draw(time);
      animFrame = requestAnimationFrame(loop);
    }

    // Status strip
    function buildStatusStrip() {
      var strip = document.getElementById('status-strip');
      strip.innerHTML = '';
      oscillators.forEach(function(osc, i) {
        var pip = document.createElement('div');
        pip.className = 'status-pip' + (osc.synced ? ' synced' : '');
        pip.style.borderColor = osc.synced ? '' : osc.color;
        pip.textContent = (i + 1);
        pip.id = 'pip-' + i;
        strip.appendChild(pip);
      });
    }

    function updatePip(idx) {
      var pip = document.getElementById('pip-' + idx);
      var osc = oscillators[idx];
      pip.className = 'status-pip ' + (osc.synced ? 'synced' : 'drift');
    }

    // Patch action
    function patchPhase() {
      if (cycling) return;
      ensureAudio();
      cycling = true;

      var btn = document.getElementById('patch-btn');
      btn.disabled = true;
      btn.classList.add('glow');
      document.getElementById('scan').classList.add('visible');

      playKick();

      var toSync = Math.min(1 + Math.floor(cycleCount / 2), NUM_OSCILLATORS - countSynced());
      if (toSync <= 0) {
        allSynced();
        return;
      }

      var targets = [];
      for (var i = 0; i < toSync && targets.length < toSync; i++) {
        var idx = Math.floor(Math.random() * NUM_OSCILLATORS);
        if (!oscillators[idx].synced) targets.push(idx);
      }

      var delay = 0;
      targets.forEach(function(idx) {
        delay += 200 + Math.random() * 300;
        setTimeout(function() {
          oscillators[idx].synced = true;
          oscillators[idx].freq = 0.02;
          updatePip(idx);
          playDrift(oscillators[idx]);
        }, delay);
      });

      setTimeout(function() {
        cycling = false;
        btn.disabled = false;
        btn.classList.remove('glow');
        document.getElementById('scan').classList.remove('visible');
        cycleCount++;
        document.getElementById('cycle-count').textContent = cycleCount;

        if (countSynced() >= NUM_OSCILLATORS) {
          allSynced();
        }
      }, delay + 400);
    }

    function countSynced() {
      var c = 0;
      oscillators.forEach(function(o) { if (o.synced) c++; });
      return c;
    }

    function allSynced() {
      cycling = false;
      document.getElementById('patch-btn').disabled = true;
      document.getElementById('scan').classList.add('visible');
      document.getElementById('success').classList.add('visible');
      playSuccess();

      setTimeout(function() {
        document.getElementById('success').classList.remove('visible');
        document.getElementById('scan').classList.remove('visible');
        cycleCount++;
        document.getElementById('cycle-count').textContent = cycleCount;
        if (cycleCount >= CYCLES_TO_SYNC) {
          resetAll();
        } else {
          initOscillators();
          buildStatusStrip();
          document.getElementById('patch-btn').disabled = false;
        }
      }, 2200);
    }

    function resetAll() {
      cycleCount = 0;
      document.getElementById('cycle-count').textContent = '0';
      initOscillators();
      buildStatusStrip();
      document.getElementById('patch-btn').disabled = false;
    }

    // Mute toggle
    document.getElementById('mute-btn').addEventListener('click', function() {
      muted = !muted;
      this.textContent = muted ? '🔇 MUTED' : '🔊 AUDIO';
      this.className = muted ? 'muted' : '';
    });

    // Patch button
    document.getElementById('patch-btn').addEventListener('click', patchPhase);
    document.getElementById('phase-canvas').addEventListener('click', patchPhase);

    // Init
    function init() {
      resizeCanvas();
      initOscillators();
      buildStatusStrip();
      animFrame = requestAnimationFrame(loop);
    }

    window.addEventListener('resize', function() {
      resizeCanvas();
    });

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  })();
  </script>
</body>
</html>
