<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Precision meets pulse</title>
  <link rel="stylesheet" href="src/styles/grid.css">
</head>
<body>
  <div id="latency-probe">LAT: --ms</div>
  <div class="grid-container" id="grid"></div>
  <script src="audio/reactive/sync.js"></script>
  <script>
    const cells = [];
    const grid = document.getElementById('grid');
    for (let i = 0; i < 96; i++) {
      const c = document.createElement('div');
      c.className = 'grid-cell';
      grid.appendChild(c);
      cells.push(c);
    }
    let shifts = 0;
    const probe = document.getElementById('latency-probe');
    function scan() {
      const start = performance.now();
      const st = window.__audioState;
      if (st) {
        const idx = Math.floor(Math.abs(Math.sin(st.phase)) * 96);
        cells.forEach((c, i) => c.classList.toggle('active', i === idx && st.sweep > 0.15));
        shifts++;
        if (shifts % 100 === 0) {
          const dt = performance.now() - start;
          probe.textContent = `LAT: ${dt.toFixed(2)}ms | shifts:${shifts}`;
          probe.style.color = dt < 6 ? '#00ff00' : '#ff3333';
        }
      }
      requestAnimationFrame(scan);
    }
    requestAnimationFrame(scan);
  </script>
</body>
</html>
