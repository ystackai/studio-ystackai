<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8" />
     <meta name="viewport" content="width=device-width, initial-scale=1" />
     <title>Y is for Yolo — Grid Fracture Drop Engine</title>
     <meta name="description" content="THE GRID IS A CONTRACT. YOU CELEBRATE THE LOCK, BUT THE SYSTEM MUST FRACTURE." />
     <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <canvas id="grid-canvas" aria-hidden="true"></canvas>
    <div id="helmet" aria-hidden="true"></div>
    <div id="grain" aria-hidden="true"></div>

    <div id="drop-page">
        <div id="narrative" role="main">
           <h1>Y is for Yolo</h1>
           <p class="subtitle">THE GRID IS A CONTRACT. YOU CELEBRATE THE LOCK, BUT THE SYSTEM MUST FRACTURE.</p>
           <div id="meter-row">
              <div id="stress-meter" role="meter" aria-label="Stress level">
                 <span class="meter-label">STRESS</span>
                 <div class="meter-track">
                    <div class="meter-fill" id="stress-fill"></div>
                 </div>
              </div>
              <div id="beat-indicator" aria-label="Beat indicator" aria-live="polite">
                 <span class="beat-dot downbeat" data-beat="0"></span>
                 <span class="beat-dot" data-beat="1"></span>
                 <span class="beat-dot" data-beat="2"></span>
                 <span class="beat-dot" data-beat="3"></span>
              </div>
           </div>
           <p class="status" id="status" aria-live="polite">GRID STANDBY</p>
        </div>

        <div id="controls" role="group" aria-label="Grid controls">
           <button class="btn btn-accent" id="btn-lock" aria-describedby="status">Lock</button>
           <button class="btn" id="btn-stress" disabled aria-describedby="status">Stress</button>
           <button class="btn btn-accent" id="btn-fracture" disabled aria-describedby="status">Fracture</button>
        </div>
    </div>

     <script src="game.js"></script>
</body>
</html>
