<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ystackai — Phase Sync</title>
  <style>
    :root {
      --space-fibonacci-5: 8px;
      --g1: #0b1120;
      --g2: #1c1030;
      --g3: #2d1b4a;
      --accent: #fde047;
      --accent2: #fb7185;
      --accent3: #67e8f9;
      --text: #e2e8f0;
      --soft: #64748b;
      --grid-bg: rgba(99,102,241,0.06);
      --cell-border: rgba(148,163,184,0.08);
      --cell-active: rgba(253,224,71,0.25);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      overflow: hidden;
      background: linear-gradient(135deg, var(--g1), var(--g2), var(--g3));
      color: var(--text);
      font-family: 'Inter', -apple-system, 'Segoe UI', system-ui, sans-serif;
    }
    #app {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: var(--space-fibonacci-5);
    }
    #headline {
      font-size: clamp(1.4rem, 3.5vw, 2.8rem);
      font-weight: 900;
      letter-spacing: -1.5px;
      margin-bottom: 0.15rem;
      text-align: center;
    }
    #subcopy {
      font-size: clamp(0.7rem, 1.4vw, 0.95rem);
      color: var(--soft);
      text-align: center;
      margin-bottom: 1.2rem;
      line-height: 1.4;
    }
    #grid-container {
      position: relative;
      width: min(90vw, 720px);
      aspect-ratio: 2 / 1;
    }
    #grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      grid-template-rows: repeat(6, 1fr);
      gap: var(--space-fibonacci-5);
      width: 100%;
      height: 100%;
    }
    .cell {
      border: 1px solid var(--cell-border);
      border-radius: 3px;
      background: var(--grid-bg);
      transition: background 0.08s ease, transform 0.12s ease, border-color 0.08s ease;
      will-change: transform, background;
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }
    .cell::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      opacity: 0;
      background: radial-gradient(circle at center, var(--accent), transparent 70%);
      transition: opacity 0.1s ease;
    }
    .cell.fire::after { opacity: 1; }
    .cell.fire {
      border-color: rgba(253,224,71,0.5);
      transform: scale(1.08);
    }
    .cell.glow {
      background: var(--cell-active);
      border-color: rgba(253,224,71,0.3);
    }
    #waveform {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 40%;
      pointer-events: none;
      opacity: 0.6;
    }
    waveform canvas {
      width: 100%;
      height: 100%;
    }
    #controls {
      display: flex;
      gap: 1rem;
      margin-top: 1.2rem;
      align-items: center;
    }
    #toggle {
      padding: 0.5rem 1.2rem;
      border-radius: 8px;
      border: 1px solid rgba(253,224,71,0.3);
      background: transparent;
      color: var(--accent);
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    #toggle:hover { background: rgba(253,224,71,0.1); }
    #status {
      font-size: 0.7rem;
      color: var(--soft);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    #phase-display {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent3);
      font-variant-numeric: tabular-nums;
      min-width: 4ch;
    }
    #info-bar {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      margin-top: 0.6rem;
    }
    #info-bar span {
      font-size: 0.7rem;
      color: var(--soft);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    /* Mute button */
    #mute-btn {
      position: fixed;
      top: 0.5rem;
      right: 0.5rem;
      background: transparent;
      border: 1px solid var(--cell-border);
      border-radius: 6px;
      padding: 0.3rem 0.6rem;
      font-size: 0.75rem;
      color: var(--soft);
      cursor: pointer;
      z-index: 10;
    }
    #mute-btn:hover { color: var(--text); }

    @media (max-width: 600px) {
      #grid-container { aspect-ratio: 16/10; }
      #controls { flex-wrap: wrap; justify-content: center; }
    }
  </style>
</head>
<body>
  <button id="mute-btn" aria-label="Toggle audio mute">♪</button>
  <div id="app">
    <div id="headline">ystackai</div>
    <div id="subcopy">phase-synced oscillator grid · click or tap any cell</div>
    <div id="grid-container">
      <div id="grid"></div>
      <canvas id="waveform" width="720" height="180" aria-hidden="true"></canvas>
    </div>
    <div id="controls">
      <span id="status">idle</span>
      <button id="toggle" aria-label="Toggle oscillator sequence">▶ Trigger</button>
      <span id="phase-display">0.00</span>
    </div>
    <div id="info-bar">
      <span>12‑col grid</span>
      <span id="tempo-label">120 BPM</span>
      <span id="count-label">0 / 72</span>
    </div>
  </div>
  <script src="oscillator.js"></script>
</body>
</html>
