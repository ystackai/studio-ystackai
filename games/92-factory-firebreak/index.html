<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Factory Firebreak — ystackai</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#0d0d1a;color:#c8c8d8;font-family:'IBM Plex Mono','Space Mono','Fira Code',monospace;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#game-container{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;position:relative}
#hud{width:100%;max-width:900px;display:flex;justify-content:space-between;align-items:center;padding:8px 16px;background:#141425;border-bottom:1px solid #2a2a4a;font-size:15px;flex-shrink:0;z-index:10}
.hud-item{display:flex;align-items:center;gap:6px}
.hud-label{color:#6a6a8a;font-size:11px;text-transform:uppercase;letter-spacing:1px}
.hud-value{font-weight:700;font-size:16px}
#score-val{color:#00e5ff}
#time-val{color:#ff6b35}
#level-val{color:#a78bfa}
#builds-val{color:#fbbf24}
#secrets-val{color:#ff88aa}
#integrity-val{color:#44ff88}
#transit-val{color:#00e5ff}
#fires-val{color:#ff6644}
#canvas-wrapper{position:relative;flex:1;width:100%;max-width:900px;display:flex;align-items:center;justify-content:center;min-height:0}
canvas{display:block;background:#111122;image-rendering:pixelated;image-rendering:crisp-edges;max-width:100%;max-height:100%}
#overlay{position:absolute;top:4px;left:50%;transform:translateX(-50%);width:auto;min-width:260px;padding:6px 14px;display:flex;flex-direction:column;align-items:center;background:rgba(12,12,22,0.35);border:1px solid rgba(60,60,100,0.4);border-radius:4px;z-index:20;transition:opacity 0.2s ease}
#overlay.hidden{opacity:0;pointer-events:none}
#overlay h1{font-size:15px;color:#ff6644;margin:0 0 1px;text-shadow:0 0 8px rgba(255,102,68,0.4);letter-spacing:1px}
#overlay h2{font-size:10px;color:#00e5ff;margin:0;font-weight:400;opacity:0.7}
#overlay .final-score{font-size:36px;color:#00e5ff;margin:12px 0;text-shadow:0 0 15px rgba(0,229,255,0.4)}
.btn{background:#1e1e3a;color:#e0e0f0;border:1px solid #3a3a6a;padding:14px 36px;font-family:inherit;font-size:16px;cursor:pointer;border-radius:4px;transition:all 0.15s ease;margin:6px;min-width:48px;min-height:48px}
.btn:hover{background:#2a2a5a;border-color:#5a5a9a}
.btn.primary{background:#0066cc;border-color:#0088ff;color:#fff}
.btn.primary:hover{background:#0077ee}
#touch-controls{display:none;position:absolute;bottom:16px;left:50%;transform:translateX(-50%);z-index:15}
.touch-row{display:flex;justify-content:center;gap:4px}
.touch-btn{width:60px;height:60px;background:rgba(30,30,60,0.85);border:1px solid #4a4a7a;border-radius:8px;color:#c8c8e8;font-size:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.touch-btn:active{background:rgba(60,60,120,0.95)}
.touch-spacer{width:60px;height:60px}
#mobile-extinguish{position:absolute;bottom:110px;right:16px;width:78px;height:78px;background:rgba(139,26,26,0.88);border:2px solid #cc4444;border-radius:50%;color:#fff;font-size:13px;font-weight:700;display:none;align-items:center;justify-content:center;cursor:pointer;z-index:15;touch-action:manipulation;-webkit-tap-highlight-color:transparent;text-align:center;line-height:1.15}
.legend{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-top:12px;font-size:11px}
.legend-item{display:flex;align-items:center;gap:4px}
.legend-swatch{width:12px;height:12px;border-radius:2px;display:inline-block}
#controls-hint{display:none}
#process-prompt{position:absolute;top:62%;left:50%;transform:translate(-50%,-50%);color:#44ff44;font-size:15px;font-weight:700;z-index:12;pointer-events:none;opacity:0;transition:opacity 0.12s ease, transform 0.12s ease;text-shadow:0 0 8px rgba(68,255,68,0.6);background:rgba(8,8,18,0.7);padding:4px 11px;border-radius:3px;border:1px solid rgba(68,255,68,0.5)}
#process-prompt.show{opacity:1; transform:translate(-50%,-55%) scale(1.03);}
@media(pointer:coarse){#touch-controls{display:block}#mobile-extinguish{display:flex}#controls-hint{display:none}}
@media(max-width:600px){#hud{font-size:11px;padding:6px 8px}.hud-value{font-size:13px}}
</style>
</head>
<body>
<div id="game-container">
     <div id="hud">
         <div class="hud-item"><span class="hud-label">Score</span><span class="hud-value" id="score-val">0</span></div>
         <div class="hud-item"><span class="hud-label">Wave</span><span class="hud-value" id="level-val">1</span></div>
         <div class="hud-item"><span class="hud-label">Shipped</span><span class="hud-value" id="builds-val">0</span></div>
         <div class="hud-item"><span class="hud-label">Secrets</span><span class="hud-value" id="secrets-val">0</span></div>
         <div class="hud-item"><span class="hud-label">Integrity</span><span class="hud-value" id="integrity-val">100%</span></div>
         <div class="hud-item"><span class="hud-label">Transit</span><span class="hud-value" id="transit-val">0</span></div>
         <div class="hud-item"><span class="hud-label">Ext</span><span class="hud-value" id="ext-val">0</span></div>
         <div class="hud-item"><span class="hud-label">Fires</span><span class="hud-value" id="fires-val">0</span></div>
         <div class="hud-item"><span class="hud-label">Time</span><span class="hud-value" id="time-val">3:00</span></div>
     </div>
     <div id="canvas-wrapper">
         <canvas id="game-canvas" width="880" height="560"></canvas>
         <div id="process-prompt">&#9654; STATION READY</div>
         <div id="overlay">
             <h1>&#128293; FACTORY FIREBREAK</h1>
             <h2>ystackai • click floor or SPACE to start shift</h2>
             <button class="btn primary" id="start-btn" style="padding:6px 14px;font-size:12px;min-height:32px">&#9654; COMMIT SHIFT</button>
         </div>
         <div id="touch-controls">
             <div class="touch-row">
                 <div class="touch-spacer"></div>
                 <div class="touch-btn" id="btn-up">&#9650;</div>
                 <div class="touch-spacer"></div>
             </div>
             <div class="touch-row">
                 <div class="touch-btn" id="btn-left">&#9664;</div>
                 <div class="touch-btn" id="btn-down">&#9660;</div>
                 <div class="touch-btn" id="btn-right">&#9654;</div>
             </div>
         </div>
         <div id="mobile-extinguish">&#129327;<br>ACTION</div>
         <div id="controls-hint">WASD/arrows or click grid &bull; SPACE/X/tap ACTION (context: extinguish/route/secure) &bull; Stand near station</div>
     </div>
</div>
<script>
(function(){
'use strict';

// ─── CONSTANTS ───
const GRID_W=11,GRID_H=7,CELL=80;
const CANVAS_W=GRID_W*CELL,CANVAS_H=GRID_H*CELL;
const GAME_DURATION=180;
const FIRE_TICK_RATE=2000,QUEUE_INTERVAL=5000;
const FIRE_SPAWN_MIN=5000,FIRE_SPAWN_MAX=12000;
var currentQueueInterval=QUEUE_INTERVAL; // ramps down with wave for escalating queue pressure (visible backlog on BUILD)
const PROCESS_COOLDOWN=0.2;
const T_BUILD='build',T_TEST='test',T_SHIP='ship',T_SEC='security';

const COLORS={
     [T_BUILD]:'#1a3a2a',[T_TEST]:'#1a2a3a',[T_SHIP]:'#2a2a3a',[T_SEC]:'#2a1a2a'
};
const BORDERS={
     [T_BUILD]:'#44cc44',[T_TEST]:'#4488ff',[T_SHIP]:'#aa66ff',[T_SEC]:'#ff6688'
};
const LABELS={
     [T_BUILD]:'BUILD',[T_TEST]:'TEST',[T_SHIP]:'SHIP',[T_SEC]:'SEC'
};

const LAYOUT=[
     [T_BUILD,T_BUILD,T_BUILD,0,T_TEST,0,0,T_SEC,T_SEC,T_SEC,0],
     [0,0,T_BUILD,0,0,T_TEST,0,0,0,T_SEC,0],
     [T_BUILD,T_BUILD,0,T_TEST,T_TEST,T_TEST,T_SHIP,0,T_SEC,0,T_SHIP],
     [0,0,T_BUILD,0,0,0,T_SHIP,0,0,0,T_SHIP],
     [0,T_BUILD,T_BUILD,T_TEST,0,0,T_SHIP,T_SHIP,T_SEC,0,0],
     [0,0,0,T_TEST,T_TEST,0,0,0,0,0,0],
     [T_BUILD,T_BUILD,T_BUILD,0,0,0,0,0,0,0,0],
];

// ─── CANVAS ───
const canvas=document.getElementById('game-canvas');
const ctx=canvas.getContext('2d');
canvas.width=CANVAS_W;canvas.height=CANVAS_H;

// ─── DOM ───
const overlay=document.getElementById('overlay');
const startBtn=document.getElementById('start-btn');
const scoreEl=document.getElementById('score-val');
const timeEl=document.getElementById('time-val');
const levelEl=document.getElementById('level-val');
const buildsEl=document.getElementById('builds-val');
const secretsEl=document.getElementById('secrets-val');
const integrityEl=document.getElementById('integrity-val');
const transitEl=document.getElementById('transit-val');
const extEl=document.getElementById('ext-val');
const firesEl=document.getElementById('fires-val');
const processPrompt=document.getElementById('process-prompt');
const controlsHint=document.getElementById('controls-hint');
const mobileExt=document.getElementById('mobile-extinguish');

// ─── AUDIO ───
let audioCtx=null;
function initAudio(){if(audioCtx)return;try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}
function playTone(freq,dur,type,vol){
    type=type||'square';vol=vol||0.08;
    if(!audioCtx)return;
    try{
        const o=audioCtx.createOscillator(),g=audioCtx.createGain();
        o.type=type;o.frequency.value=freq;
        g.gain.setValueAtTime(vol,audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
        o.connect(g);g.connect(audioCtx.destination);
        o.start();o.stop(audioCtx.currentTime+dur);
    }catch(e){}
}
function sfxExtinguish(){playTone(880,0.15,'sine',0.1);playTone(1100,0.1,'sine',0.06);}
function sfxFire(){playTone(150,0.3,'sawtooth',0.06);}
function sfxShip(){playTone(660,0.1,'square',0.07);playTone(880,0.15,'square',0.05);}
function sfxDeath(){playTone(200,0.5,'sawtooth',0.1);playTone(120,0.6,'sawtooth',0.08);}
function sfxWave(){playTone(440,0.1,'sine',0.08);playTone(660,0.1,'sine',0.07);playTone(880,0.15,'sine',0.06);}
function sfxBuild(){playTone(520,0.08,'triangle',0.05);}
function sfxSecret(){playTone(1200,0.2,'sine',0.08);playTone(1500,0.15,'sine',0.06);}
function sfxProcess(){playTone(700,0.06,'triangle',0.04);}

// ─── GAME STATE ───
var gameState='menu',score=0,wave=1,timeLeft=GAME_DURATION;
var buildsShipped=0,secretsSecured=0,lastIncidentsExtinguished=0;
var shiftLost=false; // set when avg health collapses (early fail)
var stations=[],particles=[],floatingTexts=[],transits=[];
var lastFireTick=0,lastQueueTick=0,nextFireSpawn=FIRE_SPAWN_MIN,fireSpawnTimer=FIRE_SPAWN_MIN;
var shakeTimer=0,shakeIntensity=0,timerInterval=null,animFrame=null,lastFrameTime=0;
var processCooldown=0,hasShownHint=false,flowUntil=0,rushFactor=1;

function createStation(x,y,type){
    return{x,y,type,health:100,hasBuild:false,hasFire:false,fireHealth:0,
        label:LABELS[type],flashTimer:0,secLevel:0,secured:false,secTimer:0,
        buildAnim:0,processAnim:0};
}

function isWalkable(x,y){return x>=0&&x<GRID_W&&y>=0&&y<GRID_H;}
function getStationAt(x,y){return stations.find(s=>s.x===x&&s.y===y)||null;}
function findAdjacent(x,y){
    const a=[];
    if(x>0)a.push({x:x-1,y:y});
    if(x<GRID_W-1)a.push({x:x+1,y:y});
    if(y>0)a.push({x:x,y:y-1});
    if(y<GRID_H-1)a.push({x:x,y:y+1});
    return a;
}

const player={x:5,y:3,dir:'right',frame:0,frameTimer:0,moving:false,actionTimer:0};

function initGame(){
    score=0;wave=1;timeLeft=GAME_DURATION;buildsShipped=0;secretsSecured=0;
    lastIncidentsExtinguished=0;particles=[];floatingTexts=[];transits=[];processCooldown=0;
    shiftLost=false; currentQueueInterval=QUEUE_INTERVAL;
    if(timeEl) timeEl.style.textShadow='';
    stations=[];
    for(let y=0;y<GRID_H;y++)for(let x=0;x<GRID_W;x++){
        const t=LAYOUT[y][x];if(t)stations.push(createStation(x,y,t));
    }
    player.x=5;player.y=3;player.dir='right';player.frame=0;
    player.frameTimer=0;player.moving=false;player.actionTimer=0;
    updateHUD();
}

function updateHUD(){
    scoreEl.textContent=score;levelEl.textContent=wave;
    buildsEl.textContent=buildsShipped;secretsEl.textContent=secretsSecured;
    const avg = stations.length ? Math.round( stations.reduce((a,s)=>a+s.health,0) / stations.length ) : 100;
    integrityEl.textContent = avg + '%';
    integrityEl.style.color = avg>60 ? '#44ff88' : avg>25 ? '#ffaa33' : '#ff3333';
    const inFlight = stations.filter(s=>s.hasBuild).length + transits.length;
    transitEl.textContent = inFlight;
    if(extEl) extEl.textContent = lastIncidentsExtinguished;
    if(firesEl){ const nf=stations.filter(s=>s.hasFire).length; firesEl.textContent=nf; firesEl.style.color=nf>0?'#ff6644':'#c8c8d8'; }
    const m=Math.floor(timeLeft/60),s=timeLeft%60;
    timeEl.textContent=m+':'+String(s).padStart(2,'0');
    if(timeLeft<=30){timeEl.style.color='#ff3333';timeEl.style.textShadow='0 0 10px #ff6644';}
    else if(timeLeft<=60){timeEl.style.color='#ffaa33';timeEl.style.textShadow='';}
    else {timeEl.style.color='#ff6b35';timeEl.style.textShadow='';}
}

// ─── PARTICLES ───
function spawnParticles(x,y,color,count,speed){
    for(let i=0;i<count;i++){
        const angle=Math.random()*Math.PI*2,spd=0.5+Math.random()*speed;
        particles.push({x:x*CELL+CELL/2,y:y*CELL+CELL/2,
            vx:Math.cos(angle)*spd,vy:Math.sin(angle)*spd,
            life:1,decay:0.02+Math.random()*0.03,color,size:2+Math.random()*4});
    }
}
function spawnFT(x,y,text,color){
    floatingTexts.push({x:x*CELL+CELL/2,y:y*CELL+CELL/2-10,text,color,life:1,vy:-0.8});
}
function spawnTransit(sx,sy,tx,ty,color){
    transits.push({sx:sx,sy:sy,tx:tx,ty:ty,prog:0,color:color});
}
function updateParticles(dt){
    for(let i=particles.length-1;i>=0;i--){
        const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vx*=0.96;p.vy*=0.96;
        p.life-=p.decay;if(p.life<=0)particles.splice(i,1);
    }
    for(let i=floatingTexts.length-1;i>=0;i--){
        const t=floatingTexts[i];t.y+=t.vy;t.life-=0.015;
        if(t.life<=0)floatingTexts.splice(i,1);
    }
}
function updateTransits(dt){
    for(let i=transits.length-1;i>=0;i--){
        const tr=transits[i];tr.prog+=dt/0.55;if(tr.prog>=1){transits.splice(i,1);continue;}
    }
}
function drawTransits(){
    for(const tr of transits){
        const px=tr.sx*CELL + (tr.tx-tr.sx)*CELL*tr.prog + CELL*0.5;
        const py=tr.sy*CELL + (tr.ty-tr.sy)*CELL*tr.prog + CELL*0.5;
        ctx.globalAlpha=Math.max(0.3,1-tr.prog*0.7);
        ctx.fillStyle=tr.color;
        ctx.beginPath();ctx.moveTo(px,py-5);ctx.lineTo(px+5,py);ctx.lineTo(px,py+5);ctx.lineTo(px-5,py);ctx.closePath();ctx.fill();
        ctx.globalAlpha=1;
    }
}

// ─── FIRE ───
function spawnFire(){
    const cands=stations.filter(s=>!s.hasFire&&s.health>0);
    if(!cands.length)return;
    const s=cands[Math.floor(Math.random()*cands.length)];
    s.hasFire=true;s.fireHealth=0;s.flashTimer=0.3;
    sfxFire();spawnParticles(s.x,s.y,'#ff4422',8,2);
}
function spreadFire(){
    const fires=stations.filter(s=>s.hasFire&&s.health>0);
    for(const fire of fires){
        const adj=findAdjacent(fire.x,fire.y);
        for(const a of adj){
            const target=getStationAt(a.x,a.y);
            if(target&&!target.hasFire&&target.health>0&&Math.random()<(0.24+wave*0.015)){
                target.hasFire=true;target.fireHealth=0;target.flashTimer=0.2;
                spawnParticles(a.x,a.y,'#ff4422',5,1.5);
            }
        }
    }
}
function extinguishNearby(){
    const px=player.x,py=player.y;
    const checked=[{x:px,y:py},{x:px-1,y:py},{x:px+1,y:py},{x:px,y:py-1},{x:px,y:py+1}];
    let ex=false;
    for(const cell of checked){
        const s=getStationAt(cell.x,cell.y);
        if(s&&s.hasFire){
            s.hasFire=false;s.fireHealth=0;s.flashTimer=0.4;
            s.health=Math.min(100,s.health+10);
            const ptsBase=50*wave; const pts=Math.floor((performance.now()<flowUntil+80?ptsBase*1.2:ptsBase)*rushFactor); score+=pts; ex=true; if(performance.now()<flowUntil+80) spawnFT(cell.x,cell.y,'FLOW!','#ffdd44'); else if(rushFactor>1) spawnFT(cell.x,cell.y,'RUSH!','#ffaa66');
            sfxExtinguish();
            spawnParticles(cell.x,cell.y,'#44ddff',16,3.5);
            spawnParticles(cell.x,cell.y,'#ffffff',8,2.5);
            spawnFT(cell.x,cell.y,'+'+pts+'!','#44ddff');
            lastIncidentsExtinguished++;
        }
    }
    if(ex){shakeTimer=0.15;shakeIntensity=3; flowUntil=performance.now()+2800; player.actionTimer=0.22; }
}

// ─── UNIFIED ACTION (readable controls: one verb for the prompt) ───
function doAction(){
    if(gameState!=='playing')return;
    const wasFlow = performance.now() < flowUntil;
    // Priority 1: extinguish (urgent)
    const beforeExt = lastIncidentsExtinguished;
    extinguishNearby();
    if(lastIncidentsExtinguished > beforeExt){ flowUntil=performance.now()+2800; return; } // did something (flow window for next verb)

    // Priority 2: process a build if adjacent (instant boost)
    const hadBuilds = buildsShipped;
    const pAdj = findAdjacent(player.x, player.y);
    let didProc = false;
    for(const a of pAdj){
        const s = getStationAt(a.x, a.y);
        if(s && s.hasBuild && !s.hasFire){
            processBuilds(); // reuses the player-adj + auto logic; will award bonus
            didProc = true;
            break;
        }
    }
    if(didProc){ flowUntil=performance.now()+2800; player.actionTimer=0.22; return; }

    // Priority 3: security secure/patrol (advance the timer or re-arm)
    for(const a of pAdj){
        const s = getStationAt(a.x, a.y);
        if(s && s.type===T_SEC){
            if(!s.secured){
                // fast-forward the secure timer
                s.secTimer += 1.2;
                const req = Math.max(0.8,2.8-wave*0.25);
                if(s.secTimer >= req){
                    s.secured=true; s.secTimer=0; s.secLevel=4;
                    const ptsBase=30*wave; const pts=Math.floor((performance.now()<flowUntil+80?ptsBase*1.2:ptsBase)*rushFactor); score+=pts; secretsSecured++; if(performance.now()<flowUntil+80) spawnFT(s.x,s.y,'FLOW!','#ffdd44'); else if(rushFactor>1) spawnFT(s.x,s.y,'RUSH!','#ffaa66');
                    sfxSecret();
                    spawnParticles(s.x,s.y,'#8888ff',18,3.5);
                    spawnParticles(s.x,s.y,'#ffbb33',12,2.5);
                    spawnFT(s.x,s.y,'SECURED! +'+pts,'#8888ff');
                    shakeTimer=0.12;shakeIntensity=2;
                } else {
                    spawnFT(s.x,s.y,'...','#ffbb33');
                }
            } else if(s.secLevel < 3.5){
                s.secLevel = Math.min(5, s.secLevel + 2.5);
                const ptsBase=8*wave; const pts=Math.floor((performance.now()<flowUntil+80?ptsBase*1.2:ptsBase)*rushFactor); score+=pts;
                spawnFT(s.x,s.y,'+'+pts+(performance.now()<flowUntil+80?' FLOW':rushFactor>1?' RUSH':'') ,'#8888ff');
                sfxSecret();
            }
            shakeTimer=0.08; shakeIntensity=1.5;
            flowUntil=performance.now()+2800; player.actionTimer=0.22; return;
        }
    }
    // Fallback: just a little pulse feedback if standing on empty
    spawnParticles(player.x, player.y, '#00e5ff', 3, 0.8);
}

// ─── BUILDS ───
function addBuildQueue(){
    const producers=stations.filter(s=>s.type===T_BUILD&&!s.hasFire&&s.health>0);
    if(!producers.length)return;
    const s=producers[Math.floor(Math.random()*producers.length)];
    s.hasBuild=true;s.flashTimer=0.2;sfxBuild();
    spawnParticles(s.x,s.y,'#44ff44',5,1);
}

function processBuilds(){
    const playerAdj=findAdjacent(player.x,player.y);
    const playerCells=new Set(playerAdj.map(a=>a.x+','+a.y));
    playerCells.add(player.x+','+player.y);
    
    let anyProcessed=false;
    
    // Player-adjacent processing (bonus points)
    for(const adj of playerAdj){
        const s=getStationAt(adj.x,adj.y);
        if(!s||!s.hasBuild||s.hasFire)continue;
        
        if(s.type===T_BUILD){
            const adj2=findAdjacent(s.x,s.y);
            for(const a of adj2){
                const t=getStationAt(a.x,a.y);
                if(t&&t.type===T_TEST&&!t.hasBuild&&!t.hasFire){
                    t.hasBuild=true;s.hasBuild=false;s.processAnim=0.5;t.processAnim=0.5;
                    const p15=Math.floor((performance.now()<flowUntil+80?15*1.2:15)*rushFactor); score+=p15; sfxProcess();
                    spawnFT(s.x,s.y,'To TEST'+(performance.now()<flowUntil+80?' FLOW':rushFactor>1?' RUSH':'') ,'#44ff44');
                    spawnTransit(s.x,s.y,t.x,t.y,'#44ff44');
                    anyProcessed=true;break;
                }
            }
        } else if(s.type===T_TEST){
            const adj2=findAdjacent(s.x,s.y);
            for(const a of adj2){
                const t=getStationAt(a.x,a.y);
                if(t&&t.type===T_SHIP&&!t.hasBuild&&!t.hasFire){
                    t.hasBuild=true;s.hasBuild=false;s.processAnim=0.5;t.processAnim=0.5;
                    const p25=Math.floor((performance.now()<flowUntil+80?25*1.2:25)*rushFactor); score+=p25;sfxProcess();
                    spawnFT(s.x,s.y,'To SHIP'+(performance.now()<flowUntil+80?' FLOW':rushFactor>1?' RUSH':'') ,'#44ff44');
                    spawnTransit(s.x,s.y,t.x,t.y,'#44ff44');
                    anyProcessed=true;break;
                }
            }
        } else if(s.type===T_SHIP){
            s.hasBuild=false;
            const ptsBase=30*wave; const pts=Math.floor((performance.now()<flowUntil+80?ptsBase*1.2:ptsBase)*rushFactor);score+=pts;buildsShipped++;
            s.processAnim=0.5;
            sfxShip();
            spawnParticles(s.x,s.y,'#aa66ff',14,2.5);
            spawnParticles(s.x,s.y,'#ffdd44',10,2);
            spawnFT(s.x,s.y,'SHIPPED! +'+pts+(performance.now()<flowUntil+80?' FLOW':rushFactor>1?' RUSH':'') ,'#aa66ff');
            shakeTimer=0.1;shakeIntensity=2.5;
            anyProcessed=true;break;
        }
        if(anyProcessed)break;
    }
    
    // Auto-process from build to test (fewer points, passive)
    if(!anyProcessed){
        const built=stations.filter(s=>s.hasBuild&&!s.hasFire);
        for(const s of built){
            if(s.type===T_BUILD){
                const adj=findAdjacent(s.x,s.y);
                for(const a of adj){
                    const t=getStationAt(a.x,a.y);
                    if(t&&t.type===T_TEST&&!t.hasBuild&&!t.hasFire){
                        t.hasBuild=true;s.hasBuild=false;
                        s.flashTimer=0.1;t.flashTimer=0.1;
                        score+=5;
                        spawnTransit(s.x,s.y,t.x,t.y,'#44ff44');
                        return;
                    }
                }
            } else if(s.type===T_TEST){
                const adj=findAdjacent(s.x,s.y);
                for(const a of adj){
                    const t=getStationAt(a.x,a.y);
                    if(t&&t.type===T_SHIP&&!t.hasBuild&&!t.hasFire){
                        t.hasBuild=true;s.hasBuild=false;
                        s.flashTimer=0.1;t.flashTimer=0.1;
                        score+=15;
                        spawnTransit(s.x,s.y,t.x,t.y,'#44ff44');
                        return;
                    }
                }
            }
        }
    }
}

// ─── SECURITY ───
function processSecurity(dt){
    // Global decay for secured stations: protection requires you to keep visiting under pressure
    for(const s of stations){
        if(s.type===T_SEC&&s.secured){
            const before = s.secLevel;
            s.secLevel=Math.max(0,s.secLevel-dt*0.9);
            if(before>0.01 && s.secLevel<=0.01){
                s.secured=false;s.secTimer=0;
                // Consequential leak: penalty + feedback (makes "protect secrets" tense)
                score = Math.max(0, score - 25);
                spawnParticles(s.x,s.y,'#ff3366',9,2.5);
                spawnFT(s.x,s.y,'LEAK! -25','#ff3366');
                sfxFire();
            }
        }
    }
    const adj=findAdjacent(player.x,player.y);
    for(const a of adj){
        const s=getStationAt(a.x,a.y);
        if(!s||s.type!==T_SEC)continue;
        if(!s.secured){
            s.secTimer+=dt;
            const reqTime=Math.max(0.8,2.8-wave*0.25);
            if(s.secTimer>=reqTime){
                s.secured=true;s.secTimer=0;s.secLevel=4;
                const pts=30*wave;score+=pts;secretsSecured++;
                sfxSecret();
                spawnParticles(s.x,s.y,'#8888ff',15,3);
                spawnParticles(s.x,s.y,'#ffbb33',10,2);
                spawnFT(s.x,s.y,'SECURED! +'+pts,'#8888ff');
            }
        }else{
            // Patrolling re-arms the buffer and yields occasional vigilance points
            if(s.secLevel<3.5){
                s.secLevel=Math.min(5,s.secLevel+dt*3);
                if(Math.random()<0.06){const pts=Math.floor(8*wave*rushFactor);score+=pts;spawnFT(s.x,s.y,'+'+pts+(rushFactor>1?' RUSH':''),'#8888ff');}
            }
        }
    }
}

// ─── INPUT ───
const keys={};
let moveCooldown=0;

document.addEventListener('keydown',function(e){
    keys[e.key]=true;
    if(e.key===' '||e.key==='x'||e.key==='X'){
        if(gameState==='playing')doAction();
        else if(gameState==='gameover'||gameState==='menu'){ startGame(); }
    }
    if(e.key==='r'||e.key==='R'){
        if(gameState==='gameover'||gameState==='menu')startGame();
    }
    if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].indexOf(e.key)>=0)e.preventDefault();
});
document.addEventListener('keyup',function(e){keys[e.key]=false;});

function setupTouch(id,key){
    const b=document.getElementById(id);if(!b)return;
    const s=function(e){e.preventDefault();keys[key]=true;};
    const en=function(e){e.preventDefault();keys[key]=false;};
    b.addEventListener('touchstart',s,{passive:false});
    b.addEventListener('touchend',en,{passive:false});
    b.addEventListener('touchcancel',en,{passive:false});
    b.addEventListener('mousedown',s);
    b.addEventListener('mouseup',en);
    b.addEventListener('mouseleave',en);
}
setupTouch('btn-up','ArrowUp');setupTouch('btn-down','ArrowDown');
setupTouch('btn-left','ArrowLeft');setupTouch('btn-right','ArrowRight');
mobileExt.addEventListener('touchstart',function(e){e.preventDefault();if(gameState==='playing')doAction();},{passive:false});
mobileExt.addEventListener('mousedown',function(){if(gameState==='playing')doAction();});

// Pointer (mouse) support alongside keyboard/touch for readable controls
canvas.addEventListener('mousedown',function(e){
  if(gameState==='menu'||gameState==='gameover'){ startGame(); return; }
  if(gameState!=='playing')return;
  const r=canvas.getBoundingClientRect();
  const gx=Math.floor( ((e.clientX-r.left)/r.width)*CANVAS_W / CELL );
  const gy=Math.floor( ((e.clientY-r.top)/r.height)*CANVAS_H / CELL );
  if(!isWalkable(gx,gy))return;
  const dx=gx-player.x, dy=gy-player.y;
  if((Math.abs(dx)<=1&&Math.abs(dy)<=1)&&(dx||dy)){
    player.x=gx;player.y=gy; moveCooldown=0.06;
    if(dx>0)player.dir='right';else if(dx<0)player.dir='left';else if(dy<0)player.dir='up';else player.dir='down';
    spawnParticles(gx,gy,'#00e5ff',2,0.6);
  }else if(Math.abs(dx)<=2&&Math.abs(dy)<=2){ doAction(); }
});

// ─── PLAYER ───
function updatePlayer(dt){
    if(moveCooldown>0){moveCooldown-=dt;return;}
    let dx=0,dy=0;
    if(keys['ArrowUp']||keys['w']||keys['W'])dy=-1;
    if(keys['ArrowDown']||keys['s']||keys['S'])dy=1;
    if(keys['ArrowLeft']||keys['a']||keys['A'])dx=-1;
    if(keys['ArrowRight']||keys['d']||keys['D'])dx=1;
    if(dx!==0||dy!==0){
        const nx=player.x+dx,ny=player.y+dy;
        if(isWalkable(nx,ny)){
            player.x=nx;player.y=ny;player.moving=true;
            if(dx>0)player.dir='right';else if(dx<0)player.dir='left';
            else if(dy<0)player.dir='up';else player.dir='down';
            moveCooldown=0.09;
            spawnParticles(nx,ny,'#00e5ff',2,0.5);
        }
    }else player.moving=false;
    player.frameTimer+=dt;
    if(player.frameTimer>0.2){player.frameTimer=0;player.frame=(player.frame+1)%4;}
    if(player.actionTimer>0) player.actionTimer-=dt;
}

// ─── DIFFICULTY ───
function updateDifficulty(){
    const elapsed=GAME_DURATION-timeLeft;
    const nw=Math.floor(elapsed/30)+1;
    if(nw>wave){wave=nw;sfxWave();
        spawnFT(Math.floor(GRID_W/2),Math.floor(GRID_H/2),'WAVE '+wave,'#a78bfa');
        // juice: central burst + shake on escalation
        spawnParticles(Math.floor(GRID_W/2),Math.floor(GRID_H/2),'#a78bfa',18,2.5);
        shakeTimer=0.25; shakeIntensity=4;
    }
    nextFireSpawn=Math.max(2000,FIRE_SPAWN_MAX-(wave-1)*800);
    currentQueueInterval=Math.max(2200,QUEUE_INTERVAL-(wave-1)*650); // escalating queues: faster spawns = visible backlog pressure to route under fire/incident load
    if(timeLeft<=30){ // final-sprint pressure: last 30s of the 3:00 timer becomes a real "firebreak" rush (more incidents + backlog to juggle while shipping last builds)
      nextFireSpawn=Math.max(1200,nextFireSpawn*0.6);
      currentQueueInterval=Math.max(1400,currentQueueInterval*0.65);
      rushFactor=1.25;
    } else {
      rushFactor=1;
    }
}

// ─── RENDERING ───
function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
    ctx.closePath();
}

function drawStation(s,t){
    const cx=s.x*CELL+CELL/2,cy=s.y*CELL+CELL/2;
    const hw=CELL*0.42,hh=CELL*0.42;
    
    let col=COLORS[s.type];
    if(s.hasFire)col='#3a1a1a';
    if(s.secured)col='#2a2a4a';
    
    const flash=s.flashTimer>0?Math.sin(s.flashTimer*30)*0.3:0;
    const procGlow=s.processAnim>0?Math.sin(s.processAnim*20)*0.2:0;
    ctx.globalAlpha=0.7+flash+procGlow;
    roundRect(cx-hw,cy-hh,hw*2,hh*2,6);ctx.fill();
    ctx.globalAlpha=1;
    
    // Border with glow
    ctx.strokeStyle=s.flashTimer>0?'#ffffff':s.secured?'#8888ff':s.hasFire?'#ff4444':BORDERS[s.type];
    ctx.lineWidth=2;
    if(s.secured||s.hasFire){ctx.shadowColor=s.secured?'#8888ff':'#ff4444';ctx.shadowBlur=8;}
    roundRect(cx-hw,cy-hh,hw*2,hh*2,6);ctx.stroke();
    ctx.shadowBlur=0;
    
    // Label
    ctx.fillStyle=BORDERS[s.type]||'#888';
    ctx.font='bold 11px monospace';ctx.textAlign='center';
    ctx.fillText(s.label,cx,cy-4);
    
    // Status
    const sy=cy+12;
    if(s.hasBuild){
        ctx.fillStyle='#44ff44';ctx.font='bold 13px monospace';
        ctx.fillText('\u25c8',cx,sy);
        // queued-work pip (escalating backlog telegraph)
        if(s.type===T_BUILD){
            ctx.fillStyle='#ccffdd';ctx.font='10px monospace';
            ctx.fillText('\u2022',cx+11,sy-1);
        }
    }
    
    // Fire (larger/brighter per feedback, more alive under pressure)
    if(s.hasFire){
        const fp=Math.sin(t*9+s.x*2+s.y*4);
        const fs=11+fp*4.5;
        ctx.fillStyle='#ff3311';ctx.beginPath();ctx.arc(cx-9,sy-1,fs*0.55,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#ffcc33';ctx.beginPath();ctx.arc(cx+7,sy-3,fs*0.4,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#ff5500';ctx.beginPath();ctx.arc(cx+1,sy+5,fs*0.45,0,Math.PI*2);ctx.fill();
        // extra heat layer
        ctx.globalAlpha=0.5+Math.sin(t*11)*0.2;
        ctx.fillStyle='#ffaa00';ctx.beginPath();ctx.arc(cx-2,sy+1,fs*0.7,0,Math.PI*2);ctx.fill();
        ctx.globalAlpha=1;
        
        // Health bar (more prominent)
        const bw=hw*1.7,bh=4,bx=cx-bw/2,by=cy+hh+5;
        ctx.fillStyle='#222244';ctx.fillRect(bx,by,bw,bh);
        const hp=s.health/100;
        ctx.fillStyle=hp>0.5?'#44ff88':hp>0.25?'#ffcc44':'#ff2222';
        ctx.fillRect(bx,by,bw*hp,bh);
        if(hp<0.3){
            const ap=Math.sin(t*11)*0.5+0.6;
            ctx.fillStyle='rgba(255,40,40,'+ap+')';ctx.font='bold 10px monospace';ctx.textAlign='center';
            ctx.fillText('!',cx,by-4);
        }
    }
    
    // Security shield (larger/brighter)
    if(s.type===T_SEC){
        if(s.secured){
            ctx.fillStyle='#99aaff';ctx.font='18px sans-serif';ctx.textAlign='center';
            ctx.fillText('\u25c6',cx,cy-hh-8);
            ctx.font='bold 8px monospace';ctx.fillText('LOCKED',cx,cy+hh+17);
        } else {
            const pulse=Math.sin(t*3.5)*0.5+0.5;
            ctx.globalAlpha=pulse*0.75;
            ctx.fillStyle='#ff5577';ctx.font='16px sans-serif';ctx.textAlign='right';
            ctx.fillText('\u26a0',cx+hw+5,cy-hh-3);
            ctx.globalAlpha=1;
        }
    }
    
    // Ship progress (brighter)
    if(s.type===T_SHIP&&s.hasBuild&&!s.hasFire){
        const sp=Math.sin(t*5);
        ctx.fillStyle='#ffee99';ctx.font='bold 11px monospace';ctx.textAlign='center';
        ctx.fillText('\ud83d\udce6 '+Math.round(sp*10+12)+'%',cx,cy+hh+18);
    }
    
    // Tile-scale context affordance (obvious verb at tile size when near) + process ring
    const playerAdj=findAdjacent(player.x,player.y);
    const isPlayerNear=playerAdj.some(a=>a.x===s.x&&a.y===s.y);
    if(isPlayerNear){
        if(s.hasFire){
            // big obvious EXTINGUISH glyph on the tile itself
            ctx.fillStyle='rgba(255,60,40,0.9)';ctx.font='bold 14px monospace';ctx.textAlign='center';
            ctx.fillText('EXT',cx,cy-hh-14);
            ctx.strokeStyle='rgba(255,80,50,0.85)';ctx.lineWidth=2.5;
            roundRect(cx-hw-4,cy-hh-4,hw*2+8,hh*2+8,4);ctx.stroke();
        } else if(s.hasBuild&&!s.hasFire){
            ctx.fillStyle='rgba(80,255,120,0.9)';ctx.font='bold 13px monospace';ctx.textAlign='center';
            ctx.fillText('ROUTE',cx,cy-hh-14);
            const pulse=Math.sin(t*6)*0.35+0.65;
            ctx.strokeStyle='rgba(68,255,68,'+pulse+')';ctx.lineWidth=2.5;
            roundRect(cx-hw-4,cy-hh-4,hw*2+8,hh*2+8,4);ctx.stroke();
        } else if(s.type===T_SEC){
            const label = !s.secured ? 'SECURE' : 'PATROL';
            ctx.fillStyle='rgba(170,140,255,0.9)';ctx.font='bold 12px monospace';ctx.textAlign='center';
            ctx.fillText(label,cx,cy-hh-14);
            ctx.strokeStyle='rgba(140,110,255,0.75)';ctx.lineWidth=2;
            roundRect(cx-hw-3,cy-hh-3,hw*2+6,hh*2+6,4);ctx.stroke();
        }
    }
    // legacy small process ring for builds (kept for juice)
    if(isPlayerNear&&!s.hasFire&&s.hasBuild){
        const pulse=Math.sin(t*5)*0.3+0.7;
        ctx.strokeStyle='rgba(68,255,68,'+pulse*0.5+')';ctx.lineWidth=1.5;
        ctx.setLineDash([2,4]);
        roundRect(cx-hw-2,cy-hh-2,hw*2+4,hh*2+4,6);ctx.stroke();
        ctx.setLineDash([]);
    }
}

function drawPlayer(t){
    const cx=player.x*CELL+CELL/2,cy=player.y*CELL+CELL/2;
    const bob=player.moving?Math.sin(t*12)*2.2:0;
    const actPulse = (player.actionTimer||0)>0 ? Math.sin((player.actionTimer||0)*28)*0.4+0.6 : 0;
    
    // Stronger brighter glow (larger agent per feedback)
    ctx.fillStyle='rgba(0,229,255,'+(0.22+actPulse*0.12)+')';ctx.beginPath();ctx.arc(cx,cy+bob,28,0,Math.PI*2);ctx.fill();
    
    // Body (larger/brighter cyan agent)
    ctx.fillStyle='#00f0ff';ctx.beginPath();ctx.arc(cx,cy+bob,13,0,Math.PI*2);ctx.fill();
    
    // Utility pack (factory agent kit) + action flash
    ctx.fillStyle=actPulse>0.1?'#22aacc':'#007788';ctx.fillRect(cx-5,cy+bob+3,10,8);
    ctx.fillStyle='#00ccdd';ctx.fillRect(cx-4,cy+bob+4,3,3);ctx.fillRect(cx+1,cy+bob+4,3,3);
    
    // Helmet (brighter)
    ctx.fillStyle='#00aacc';ctx.beginPath();ctx.arc(cx,cy+bob-4,10,Math.PI,0);ctx.fill();
    
    // Eyes + visor glint
    ctx.fillStyle='#fff';
    const eo=player.dir==='left'?-4:player.dir==='right'?4:0;
    ctx.beginPath();ctx.arc(cx-4+eo,cy+bob-3,2.5,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(cx+4+eo,cy+bob-3,2.5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.6)';ctx.fillRect(cx-1+eo,cy+bob-5,3,1.5);
    
    // Walking legs + slight lean on action
    if(player.moving){
        const lp=Math.sin(t*14);
        ctx.strokeStyle='#00aacc';ctx.lineWidth=2.5;ctx.beginPath();
        ctx.moveTo(cx-4,cy+bob+12);ctx.lineTo(cx-4+lp*4,cy+bob+19);
        ctx.moveTo(cx+4,cy+bob+12);ctx.lineTo(cx+4-lp*4,cy+bob+19);
        ctx.stroke();
    }
    if(actPulse>0.1){
        ctx.strokeStyle='rgba(255,220,120,0.7)';ctx.lineWidth=2;
        ctx.beginPath();ctx.moveTo(cx-6,cy+bob+1);ctx.lineTo(cx+6,cy+bob+1);ctx.stroke();
    }
    
    // Stronger action-ready ring (tile-scale context obvious)
    const pAdj=findAdjacent(player.x,player.y);
    const nearActionable = pAdj.some(a=>{ const s=getStationAt(a.x,a.y); return s && (s.hasFire || (s.hasBuild&&!s.hasFire) || s.type===T_SEC); });
    if(nearActionable){
        const ap=Math.sin(t*20)*0.5+0.5;
        ctx.strokeStyle='rgba(80,255,120,'+(0.65+ap*0.3)+')';ctx.lineWidth=2.5;
        ctx.beginPath();ctx.arc(cx,cy+bob,17,0,Math.PI*2);ctx.stroke();
        ctx.lineWidth=1;
    }
}

function drawParticles(){
    for(const p of particles){
        ctx.globalAlpha=p.life;ctx.fillStyle=p.color;
        ctx.beginPath();ctx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
    for(const ft of floatingTexts){
        ctx.globalAlpha=ft.life;ctx.fillStyle=ft.color;
        ctx.font='bold 14px monospace';ctx.textAlign='center';
        ctx.fillText(ft.text,ft.x,ft.y);
    }
    ctx.globalAlpha=1;
}

function drawGrid(){
    ctx.strokeStyle='#1a1a2e';ctx.lineWidth=0.5;
    for(let x=0;x<=GRID_W;x++){ctx.beginPath();ctx.moveTo(x*CELL,0);ctx.lineTo(x*CELL,CANVAS_H);ctx.stroke();}
    for(let y=0;y<=GRID_H;y++){ctx.beginPath();ctx.moveTo(0,y*CELL);ctx.lineTo(CANVAS_W,y*CELL);ctx.stroke();}
}

function drawConveyors(t){
    const phase = ((t||0)*0.9) % 1;
    ctx.strokeStyle='rgba(0,229,255,0.08)';ctx.lineWidth=1.5;
    const builds=stations.filter(s=>s.type===T_BUILD);
    const ships=stations.filter(s=>s.type===T_SHIP);
    // Only connect sensible rightward production lanes (avoid n*m cross mesh clutter)
    for(const b of builds){
        // find nearest ship to the right (or any if none right)
        let best=null, bestDx=999;
        for(const sh of ships){
            const dx=sh.x - b.x;
            if(dx>0 && dx<bestDx){best=sh;bestDx=dx;}
        }
        if(!best && ships.length) best=ships[0];
        if(!best) continue;
        const x1=b.x*CELL+CELL/2, y1=b.y*CELL+CELL/2;
        const x2=best.x*CELL+CELL/2, y2=best.y*CELL+CELL/2;
        // base faint line
        ctx.setLineDash([3,9]);
        ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
        // animated moving dashes (lineDashOffset) for clear live production routing feel
        ctx.strokeStyle='rgba(0,229,255,0.45)';
        ctx.lineWidth=2;
        ctx.setLineDash([6,10]);
        ctx.lineDashOffset = -(phase * 28);
        ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
        ctx.lineDashOffset=0; ctx.lineWidth=1.5; ctx.strokeStyle='rgba(0,229,255,0.08)';
        // passive signal pips: always-visible idle traffic showing the production infrastructure is live (even with no active builds)
        ctx.fillStyle='rgba(0,229,255,0.35)';
        for(let k=0;k<3;k++){
            const p = (phase + k*0.33) % 1;
            const px = x1 + (x2-x1)*p, py = y1 + (y2-y1)*p;
            ctx.beginPath();ctx.arc(px,py,1.8,0,Math.PI*2);ctx.fill();
        }
    }
    ctx.setLineDash([]);
}

// ─── GAME LOOP ───
function gameLoop(timestamp){
    if(gameState!=='playing')return;
    const dt=Math.min((timestamp-lastFrameTime)/1000,0.1);
    lastFrameTime=timestamp;const t=timestamp/1000;
    
    let shakeX=0,shakeY=0;
    if(shakeTimer>0){shakeTimer-=dt;shakeX=(Math.random()-0.5)*shakeIntensity*2;shakeY=(Math.random()-0.5)*shakeIntensity*2;shakeIntensity*=0.9;}
    
    ctx.save();ctx.translate(shakeX,shakeY);
    ctx.fillStyle='#0d0d1a';ctx.fillRect(-10,-10,CANVAS_W+20,CANVAS_H+20);
    
    drawGrid();drawConveyors(t);
    for(const s of stations)drawStation(s,t);
    drawPlayer(t);drawParticles();drawTransits();
    
    // Danger vignette
    const avgHP=stations.reduce((a,s)=>a+s.health,0)/stations.length;
    if(avgHP<40){const u=(40-avgHP)/40;ctx.fillStyle='rgba(255,30,30,'+(u*0.12)+')';ctx.fillRect(0,0,CANVAS_W,CANVAS_H);}
    if(avgHP < 5 && !shiftLost){ shiftLost=true; endGame(); }
    
    ctx.restore();
    
    updatePlayer(dt);updateParticles(dt);updateTransits(dt);
    
    // Fire tick
    if(timestamp-lastFireTick>Math.max(1500,FIRE_TICK_RATE-wave*100)){
        lastFireTick=timestamp;spreadFire();
        for(const s of stations){
            if(s.hasFire){s.health=Math.max(0,s.health-(2.5+wave*1.1));
                if(s.health<=0){s.hasFire=false;score=Math.max(0,score-100);
                    spawnFT(s.x,s.y,'DESTROYED!','#ff3333');
                    spawnParticles(s.x,s.y,'#ff2200',20,4);sfxDeath();shakeTimer=0.5;shakeIntensity=8;}
            }
        }
    }
    
    // Queue (uses currentQueueInterval which escalates with wave for visible production backlog)
    if(timestamp-lastQueueTick>currentQueueInterval){lastQueueTick=timestamp;addBuildQueue();}
    
    // Process builds
    processCooldown-=dt;
    if(processCooldown<=0){processBuilds();processCooldown=PROCESS_COOLDOWN;}
    
    // Security
    processSecurity(dt);
    
    // Process animations decay
    for(const s of stations){
        if(s.processAnim>0)s.processAnim-=dt*2;
    }
    
    // Fire spawn
    fireSpawnTimer-=dt*1000;
    if(fireSpawnTimer<=0){spawnFire();fireSpawnTimer=nextFireSpawn+Math.random()*3000;}
    
    // Make the board feel alive under pressure (subtle idle life on healthy stations — data pips, micro sparks — cheap & constant)
    if(Math.random()<0.12){
        const live=stations.filter(s=>!s.hasFire&&s.health>55);
        if(live.length){
            const s=live[Math.floor(Math.random()*live.length)];
            spawnParticles(s.x,s.y, s.type===T_BUILD?'#44ff88':s.type===T_SHIP?'#ffdd88':'#66aaff', 1, 0.6);
        }
    }
    
    updateDifficulty();updateHUD();

    // Show contextual prompt when near an actionable station (makes core verbs discoverable)
    let promptText=null;
    const pAdj=findAdjacent(player.x,player.y);
    for(const a of pAdj){
        const s=getStationAt(a.x,a.y);
        if(s){
            if(s.hasFire){promptText='EXTINGUISH';break;}
            if(s.hasBuild&&!s.hasFire){promptText='PROCESS BUILD';break;}
            if(s.type===T_SEC&&!s.secured){promptText='SECURE';break;}
            if(s.type===T_SEC&&s.secured&&s.secLevel<2){promptText='PATROL';break;}
        }
    }
    if(promptText){
        const flowNow = performance.now() < flowUntil;
        let pHtml = '▶ '+promptText;
        if(flowNow) pHtml += ' <span style="font-size:10px;color:#ffdd44;border:1px solid #ffdd44;padding:0 3px;border-radius:2px">FLOW</span>';
        else if(timeLeft<=30 && rushFactor>1) pHtml += ' <span style="font-size:10px;color:#ffaa66;border:1px solid #ffaa66;padding:0 3px;border-radius:2px">RUSH</span>';
        processPrompt.innerHTML = pHtml;
        // verb-specific color for readable urgency (red=extinguish fire incident under pressure; cyan=route builds; purple=patrol secrets)
        if(promptText==='EXTINGUISH') processPrompt.style.color='#ff6644';
        else if(promptText==='PROCESS BUILD') processPrompt.style.color='#00e5ff';
        else processPrompt.style.color='#a78bfa';
        processPrompt.classList.add('show');
        if(mobileExt) {
          mobileExt.innerHTML = (promptText==='EXTINGUISH'?'&#128293;EXT':promptText==='PROCESS BUILD'?'&#9654;ROUTE':promptText==='SECURE'?'&#128274;SEC':'&#128274;PAT') + '<br>SPACE';
          // mirror verb color on large touch target for readable urgency on mobile (red=fire incident highest pressure)
          if(promptText==='EXTINGUISH'){ mobileExt.style.color='#ffdddd'; mobileExt.style.borderColor='#ff6644'; }
          else if(promptText==='PROCESS BUILD'){ mobileExt.style.color='#aaffff'; mobileExt.style.borderColor='#00e5ff'; }
          else { mobileExt.style.color='#ddccff'; mobileExt.style.borderColor='#a78bfa'; }
        }
    } else {
        processPrompt.classList.remove('show');
        processPrompt.style.color='#44ff44';
        processPrompt.innerHTML = '&#9654; STATION READY';
        if(mobileExt){ mobileExt.innerHTML = '&#129327;<br>ACTION'; mobileExt.style.color='#fff'; mobileExt.style.borderColor='#cc4444'; }
    }
    
    animFrame=requestAnimationFrame(gameLoop);
}

// ─── START / END ───
function startGame(){
    initAudio();initGame();gameState='playing';
    updateHUD();
    if(audioCtx&&audioCtx.state==='suspended'){try{audioCtx.resume().catch(function(){});}catch(e){}}
    overlay.classList.add('hidden');
    processPrompt.classList.remove('show');
    lastFireTick=performance.now();lastQueueTick=performance.now();
    fireSpawnTimer=nextFireSpawn;lastFrameTime=performance.now();
    timerInterval=setInterval(function(){
        if(gameState!=='playing')return;timeLeft--;updateHUD();
        if(timeLeft<=0)endGame();
    },1000);
    
    // Show hint
    if(controlsHint&&!hasShownHint){
        controlsHint.classList.add('fade');
        hasShownHint=true;
    }
    
    animFrame=requestAnimationFrame(gameLoop);
}

function endGame(){
    gameState='gameover';clearInterval(timerInterval);cancelAnimationFrame(animFrame);
    processPrompt.classList.remove('show');
    const elapsed=GAME_DURATION-timeLeft;
    let rating='D';
    if(score>=3000)rating='S';else if(score>=2000)rating='A';
    else if(score>=1200)rating='B';else if(score>=600)rating='C';
    const lost = shiftLost || (stations.reduce((a,s)=>a+s.health,0)/Math.max(1,stations.length) < 8);
    const title = lost ? 'CONTAINMENT FAILED' : 'SHIFT COMPLETE';
    const tag = lost ? 'The floor is lost. Rebuild and try again.' : 'The factory survived... for now.';
    overlay.innerHTML='<h1>'+title+'</h1><h2>Final Score</h2>'
        +'<div class="final-score">'+score+'</div>'
        +'<p class="subtitle">Wave '+wave+' \u00b7 '+buildsShipped+' shipped \u00b7 '+secretsSecured+' secured \u00b7 '+lastIncidentsExtinguished+' fires out \u00b7 Rating: '+rating+'<br><span style="color:#6a6a8a">'+tag+'</span></p>'
        +'<button class="btn primary" id="restart-btn">\u25b6 ANOTHER SHIFT</button>';
    overlay.classList.remove('hidden');
    document.getElementById('restart-btn').addEventListener('click',startGame);
}

startBtn.addEventListener('click',startGame);

// ─── TITLE SCREEN ───
let titleAF=null,titleParts=[],titleDemoTransits=[];
function initTitleParticles(){
    for(let i=0;i<25;i++){
        titleParts.push({x:Math.random()*CANVAS_W,y:Math.random()*CANVAS_H,
            vx:(Math.random()-0.5)*0.5,vy:-0.3-Math.random()*0.5,
            life:0.3+Math.random()*0.7,size:1+Math.random()*2,
            color:['#ff4422','#ffaa22','#ff6600','#00e5ff','#44ff44'][Math.floor(Math.random()*5)]});
    }
    // Demo transits for title: show routing action immediately (live production floor visible behind overlay)
    titleDemoTransits=[
        {sx:0,sy:0,tx:6,ty:2,prog:0.1,color:'#44ff44'}, // build -> ship lane
        {sx:2,sy:0,tx:8,ty:3,prog:0.55,color:'#44ff44'},
        {sx:1,sy:2,tx:7,ty:2,prog:0.8,color:'#44ff44'}
    ];
}
function titleLoop(ts){
    if(gameState!=='menu')return;
    const t=ts/1000;
    ctx.fillStyle='#0d0d1a';ctx.fillRect(0,0,CANVAS_W,CANVAS_H);
    ctx.strokeStyle='#1a1a2e';ctx.lineWidth=0.5;
    for(let x=0;x<=GRID_W;x++){ctx.beginPath();ctx.moveTo(x*CELL,0);ctx.lineTo(x*CELL,CANVAS_H);ctx.stroke();}
    for(let y=0;y<=GRID_H;y++){ctx.beginPath();ctx.moveTo(0,y*CELL);ctx.lineTo(CANVAS_W,y*CELL);ctx.stroke();}
    // faint live conveyors (routing) visible on title
    ctx.strokeStyle='rgba(0,229,255,0.12)';ctx.lineWidth=1.5;ctx.setLineDash([3,9]);
    const tbuilds=stations.filter(s=>s.type===T_BUILD), tships=stations.filter(s=>s.type===T_SHIP);
    for(const b of tbuilds){
        let best=null,bestDx=999;
        for(const sh of tships){const dx=sh.x-b.x; if(dx>0&&dx<bestDx){best=sh;bestDx=dx;}}
        if(!best&&tships.length)best=tships[0]; if(!best)continue;
        const x1=b.x*CELL+CELL/2,y1=b.y*CELL+CELL/2,x2=best.x*CELL+CELL/2,y2=best.y*CELL+CELL/2;
        ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
        // passive signal pips on title (live production floor routing visible immediately on first screen)
        ctx.fillStyle='rgba(0,229,255,0.22)';
        const tphase = ((ts/1000)||0)*0.9 % 1;
        for(let k=0;k<2;k++){
            const p = (tphase + k*0.4) % 1;
            const px = x1 + (x2-x1)*p, py = y1 + (y2-y1)*p;
            ctx.beginPath();ctx.arc(px,py,1.5,0,Math.PI*2);ctx.fill();
        }
    }
    ctx.setLineDash([]);
    // stations (faded but now visible through 0.58 overlay)
    for(const s of stations){
        const cx=s.x*CELL+CELL/2,cy=s.y*CELL+CELL/2;
        ctx.fillStyle=COLORS[s.type]+'44';
        roundRect(cx-CELL*0.35,cy-CELL*0.35,CELL*0.7,CELL*0.7,6);ctx.fill();
        ctx.strokeStyle=BORDERS[s.type]+'44';ctx.lineWidth=1;
        roundRect(cx-CELL*0.35,cy-CELL*0.35,CELL*0.7,CELL*0.7,6);ctx.stroke();
        ctx.fillStyle=BORDERS[s.type]+'66';ctx.font='bold 10px monospace';ctx.textAlign='center';
        ctx.fillText(s.label,cx,cy+3);
        // demo queued pip on title (makes escalating queue + route verb visible on first screen for the polish)
        if(s.hasBuild && s.type===T_BUILD){
            ctx.fillStyle='#aaffcc';ctx.font='8px monospace';ctx.fillText('\u2022',cx+7,cy+3);
        }
        // demo fire visuals on title (larger/brighter firebreak incidents visible immediately)
        if((s.x===1&&s.y===0)||(s.x===8&&s.y===0)){
            const fp=Math.sin(t*8+s.x)*0.7+0.9;
            ctx.fillStyle='#ff3311';ctx.beginPath();ctx.arc(cx-7,cy+7,6.5*fp,0,Math.PI*2);ctx.fill();
            ctx.fillStyle='#ffcc22';ctx.beginPath();ctx.arc(cx+6,cy+4,4.5*fp,0,Math.PI*2);ctx.fill();
            ctx.globalAlpha=0.45;ctx.fillStyle='#ff8800';ctx.beginPath();ctx.arc(cx,cy+9,7*fp,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
        }
    }
    // animated demo transits (routing under pressure, visible on first screen)
    for(const tr of titleDemoTransits){
        tr.prog = (tr.prog + 0.003) % 1.0;
        const px=tr.sx*CELL + (tr.tx-tr.sx)*CELL*tr.prog + CELL*0.5;
        const py=tr.sy*CELL + (tr.ty-tr.sy)*CELL*tr.prog + CELL*0.5;
        ctx.globalAlpha=0.25+0.35*(1-Math.abs(tr.prog-0.5)*2);
        ctx.fillStyle=tr.color;
        ctx.beginPath();ctx.moveTo(px,py-4);ctx.lineTo(px+4,py);ctx.lineTo(px,py+4);ctx.lineTo(px-4,py);ctx.closePath();ctx.fill();
        ctx.globalAlpha=1;
    }
    for(const p of titleParts){
        p.x+=p.vx;p.y+=p.vy;p.life-=0.003;
        if(p.life<=0||p.y<-10){p.x=Math.random()*CANVAS_W;p.y=CANVAS_H+10;p.life=0.3+Math.random()*0.7;}
        ctx.globalAlpha=p.life*0.5;ctx.fillStyle=p.color;
        ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
    // demo larger/brighter agent visible on first screen (immediate playable context, no menu wall)
    const dcx = 5*CELL + CELL*0.5 + Math.sin(ts/420)*6, dcy=3*CELL + CELL*0.5 + Math.sin(ts/310)*3;
    ctx.fillStyle='rgba(0,240,255,0.35)';ctx.beginPath();ctx.arc(dcx,dcy,11,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(0,200,230,0.55)';ctx.beginPath();ctx.arc(dcx,dcy,6,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(0,160,190,0.4)';ctx.beginPath();ctx.arc(dcx,dcy-2,5,Math.PI,0);ctx.fill();
    titleAF=requestAnimationFrame(titleLoop);
}

// Init stations for title screen
for(let y=0;y<GRID_H;y++)for(let x=0;x<GRID_W;x++){
    const t=LAYOUT[y][x];if(t)stations.push(createStation(x,y,t));
}
// demo queued work on one BUILD for title screen (telegraphs the new "escalating queues + route resources" polish immediately on first screen)
const demoBuild = stations.find(s=>s.type===T_BUILD && s.x<3 && s.y<2);
if(demoBuild) demoBuild.hasBuild=true;
initTitleParticles();titleLoop(performance.now());

})();
</script>
